<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121114">
  <meta name="robots" content="noindex, nofollow">
  <title>Our Activities</title>
  <link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1>Our Activities <span class="heart" aria-hidden="true">♥</span></h1>
      <p class="tagline muted">Just for the two of us</p>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="app-view" hidden>
    <header class="topbar">
      <h1>Our Activities <span class="heart" aria-hidden="true">♥</span></h1>
      <span id="whoami" class="muted"></span>
      <button id="sign-out" class="link" type="button">Sign out</button>
    </header>
    <main class="container">
      <div id="feed" class="feed" aria-live="polite"></div>
      <button id="more" class="btn" type="button" hidden>Load more</button>
    </main>
    <button id="new-activity" class="fab" type="button" aria-label="New activity">+</button>

    <dialog id="composer" class="sheet">
      <form method="dialog" class="composer">
        <h2>Share something new <span class="heart" aria-hidden="true">♡</span></h2>
        <fieldset class="fields">
          <label>Title <input name="title" type="text" maxlength="200" placeholder="What did we get up to?" required></label>
          <label>Details <textarea name="body" rows="4" maxlength="10000" placeholder="Tell the story (optional)"></textarea></label>
          <label>Date <input name="happened_at" type="date" required></label>
        </fieldset>
        <p class="status error" role="status"></p>
        <div class="row">
          <button class="btn" type="button" data-cancel>Cancel</button>
          <button class="btn primary" type="submit">Share</button>
        </div>
      </form>
    </dialog>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
