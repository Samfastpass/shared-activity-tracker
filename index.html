<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121114">
  <meta name="robots" content="noindex, nofollow">
  <title>Moments</title>
  <link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1>Moments</h1>
      <p class="tagline muted">Just for the two of us</p>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="app-view" hidden>
    <header class="topbar">
      <h1>Moments</h1>
      <button id="open-settings" class="who" type="button" aria-label="Settings">
        <span id="whoami-avatar"></span><span id="whoami"></span>
      </button>
      <button id="sign-out" class="link" type="button">Sign out</button>
    </header>
    <main id="feed-view" class="container">
      <section id="feedback-banner" class="fb-banner" aria-label="Feedback requests for you" hidden></section>
      <div id="feed" class="feed" aria-live="polite"></div>
      <button id="more" class="btn" type="button" hidden>Load more</button>
    </main>
    <main id="settings-view" class="container" hidden>
      <form id="settings-form" class="settings" autocomplete="off">
        <h2>Settings</h2>
        <div class="avatar-row">
          <span id="settings-avatar"></span>
          <div class="avatar-actions">
            <label class="btn photo-add">Change photo<input id="avatar-input" type="file" accept="image/*" hidden></label>
            <button id="avatar-remove" class="link" type="button">Remove photo</button>
          </div>
        </div>
        <label>Display name <input name="display_name" type="text" maxlength="60" required></label>
        <fieldset class="themes">
          <legend>Your look</legend>
          <div id="theme-tiles" class="theme-tiles"></div>
          <p class="muted">Your posts and comments are tinted with your theme's colour for both of you.</p>
        </fieldset>
        <p class="status error" role="status"></p>
        <div class="row">
          <button id="settings-back" class="btn" type="button">Back</button>
          <button class="btn primary" type="submit">Save</button>
        </div>
      </form>
    </main>
    <button id="new-activity" class="fab" type="button" aria-label="New activity">+</button>

    <dialog id="ask-dialog" class="sheet">
      <form id="ask-form" method="dialog" class="composer">
        <h2 id="ask-title">Ask for feedback</h2>
        <p id="ask-sub" class="muted"></p>
        <div id="ask-questions" class="q-list"></div>
        <button id="ask-add" class="link" type="button">+ Add a question</button>
        <div id="ask-chips" class="chips" aria-label="Question ideas"></div>
        <p class="status error" role="status"></p>
        <div class="row">
          <button class="btn" type="button" data-cancel>Cancel</button>
          <button class="btn primary" type="submit">Send request</button>
        </div>
      </form>
    </dialog>

    <dialog id="answer-dialog" class="sheet">
      <form id="answer-form" method="dialog" class="composer">
        <h2 id="answer-title">Your feedback</h2>
        <p id="answer-sub" class="muted"></p>
        <div id="answer-fields" class="q-list"></div>
        <p class="status error" role="status"></p>
        <div class="row">
          <button class="btn" type="button" data-cancel>Later</button>
          <button class="btn primary" type="submit">Send feedback</button>
        </div>
      </form>
    </dialog>

    <dialog id="composer" class="sheet">
      <form method="dialog" class="composer">
        <h2>Share something new <span class="heart" aria-hidden="true">♡</span></h2>
        <fieldset class="fields">
          <label>Title <input name="title" type="text" maxlength="200" placeholder="What did we get up to?" required></label>
          <label>Details <textarea name="body" rows="4" maxlength="10000" placeholder="Tell the story (optional)"></textarea></label>
          <label>Date <input name="happened_at" type="date" required></label>
        </fieldset>
        <p class="status error" role="status"></p>
        <div class="row">
          <button class="btn" type="button" data-cancel>Cancel</button>
          <button class="btn primary" type="submit">Share</button>
        </div>
      </form>
    </dialog>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
